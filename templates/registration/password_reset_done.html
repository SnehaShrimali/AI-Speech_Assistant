{% extends 'base.html' %}
{% block title %}Email Sent{% endblock %}
{% block content %}
<div class="min-vh-100 d-flex align-items-center justify-content-center" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
    <div class="card shadow-lg border-0" style="max-width: 480px; border-radius: 15px;">
        <div class="card-body p-5 text-center">
            <i class="fas fa-envelope text-primary fa-4x mb-3"></i>
            <h3 class="fw-bold">Check Your Email</h3>
            <p class="text-muted">We've emailed you instructions to reset your password if an account exists with that email.</p>
            <a href="{% url 'accounts:login' %}" class="btn btn-primary mt-2"><i class="fas fa-sign-in-alt me-1"></i>Back to Login</a>
        </div>
    </div>
</div>
{% endblock %}
