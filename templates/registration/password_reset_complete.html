{% extends 'base.html' %}
{% block title %}Password Reset Complete{% endblock %}
{% block content %}
<div class="min-vh-100 d-flex align-items-center justify-content-center" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
    <div class="card shadow-lg border-0" style="max-width: 440px; border-radius: 15px;">
        <div class="card-body p-5 text-center">
            <i class="fas fa-check-circle text-success fa-4x mb-3"></i>
            <h3 class="fw-bold">Password Reset Complete</h3>
            <p class="text-muted">Your password has been successfully reset.</p>
            <a href="{% url 'accounts:login' %}" class="btn btn-primary mt-2"><i class="fas fa-sign-in-alt me-1"></i>Sign In</a>
        </div>
    </div>
</div>
{% endblock %}
